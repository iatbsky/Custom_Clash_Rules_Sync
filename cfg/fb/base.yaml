allow-lan: false
mode: rule
log-level: warning
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 'https://dns.alidns.com/dns-query#DIRECT'
  direct-nameserver:
    - 'https://dns.alidns.com/dns-query#DIRECT'
  nameserver:
    - 'https://1.1.1.1/dns-query#🚀 手动选择'
  nameserver-policy:
    'geosite:cn':
      - 'https://dns.alidns.com/dns-query#DIRECT'
    'geosite:private':
      - system
